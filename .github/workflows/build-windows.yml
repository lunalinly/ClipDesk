name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Build ClipDesk
        shell: pwsh
        env:
          CLIPDESK_SIGNING_CERT_BASE64: ${{ secrets.CLIPDESK_SIGNING_CERT_BASE64 }}
          CLIPDESK_SIGNING_CERT_PASSWORD: ${{ secrets.CLIPDESK_SIGNING_CERT_PASSWORD }}
          CLIPDESK_TIMESTAMP_URL: ${{ vars.CLIPDESK_TIMESTAMP_URL }}
        run: |
          $signingConfigured = -not [string]::IsNullOrWhiteSpace($env:CLIPDESK_SIGNING_CERT_BASE64)
          .\build-native.ps1 -RequireSigning:$signingConfigured

      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: ClipDesk-1.3.0-windows-x64
          path: |
            dist/ClipDesk-Portable-1.3.0-x64.exe
            dist/ClipDesk-Setup-1.3.0-x64.exe
            dist/ClipDesk-Clipboard-Portable-1.3.0-x64.exe
            dist/ClipDesk-Clipboard-Setup-1.3.0-x64.exe
          if-no-files-found: error
